<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing Background Drop Shadow -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50dffb" />
      <stop offset="100%" stop-color="#c488fb" />
    </linearGradient>
  </defs>

  <!-- Translucent Rounded Triangle -->
  <path d="M110 30 L190 170 C195 180 185 190 175 190 L45 190 C35 190 25 180 30 170 Z" 
        fill="rgba(13, 22, 47, 0.6)" 
        stroke="url(#brand-grad)" 
        stroke-width="4" 
        filter="url(#glow)" />
        
  <!-- "5K" Text -->
  <text x="110" y="145" 
        font-family="'JetBrains Mono', monospace" 
        font-size="64" 
        font-weight="bold" 
        fill="url(#brand-grad)" 
        text-anchor="middle"
        letter-spacing="-2">
    5K
  </text>
</svg>
