<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI5K | Profile Intelligence</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="app">
      <header class="glass-panel">
        <h1>AI5K <span>Intelligence Engine</span></h1>
        <p>Real-time profile assessment and dimensional scoring.</p>
      </header>

      <main>
        <section class="glass-panel input-section">
          <h2>Run Analysis</h2>
          <form id="analyze-form">
            <div class="form-group">
              <label for="niche">Target Niche</label>
              <input type="text" id="niche" value="ai-ml-engineer" required />
            </div>
            <div class="form-group">
              <label for="version">Benchmark Version</label>
              <input type="text" id="version" value="1.0" required />
            </div>
            <div class="form-group">
              <label for="rate">Desired Hourly Rate ($)</label>
              <input type="number" id="rate" value="120" required />
            </div>
            <div class="form-group full-width">
              <label for="cv_file">Upload CV (PDF)</label>
              <input type="file" id="cv_file" accept="application/pdf" class="file-input" />
            </div>
            <div class="form-group">
              <label for="github_url">GitHub Profile URL</label>
              <input type="url" id="github_url" placeholder="https://github.com/username" />
            </div>
            <div class="form-group">
              <label for="upwork_url">Upwork Profile URL</label>
              <input type="url" id="upwork_url" placeholder="https://upwork.com/freelancers/..." />
            </div>
            <div class="form-group full-width">
              <label for="cv">CV / Resume Text (Fallback)</label>
              <textarea id="cv" rows="3">Senior Machine Learning Engineer with 10 years of experience in Python and PyTorch. Built scalable APIs and deployed production machine learning models. AWS Certified Solutions Architect.</textarea>
            </div>
            <button type="submit" id="submit-btn" class="glow-on-hover">Analyze Profile</button>
          </form>
        </section>

        <section id="results-section" class="results-grid hidden">
          <!-- Main Score -->
          <div class="glass-panel score-panel">
            <h3>Readiness Score</h3>
            <div class="chart-container">
              <canvas id="gaugeChart"></canvas>
            </div>
            <div class="score-display">
              <span id="score-value">0</span><span class="muted">/100</span>
            </div>
          </div>

          <!-- Dimensions Radar -->
          <div class="glass-panel radar-panel">
            <h3>Dimensional Analysis</h3>
            <div class="chart-container">
              <canvas id="radarChart"></canvas>
            </div>
          </div>

          <!-- Generation & Blockers -->
          <div class="glass-panel text-panel full-width">
            <h3>Pipeline Results</h3>
            <div id="blockers-container" class="alert-box hidden"></div>
            
            <div class="assets-box">
              <h4>Generated Title</h4>
              <p id="gen-title" class="muted">Waiting for generation...</p>
              
              <h4>Generated Overview</h4>
              <p id="gen-overview" class="muted">Waiting for generation...</p>
              
              <h4>Skill Highlights</h4>
              <div id="gen-skills" class="skills-flex"></div>
            </div>
          </div>
        </section>
        
        <!-- Loading Overlay -->
        <div id="loader" class="loader-overlay hidden">
          <div class="spinner"></div>
          <p id="loader-text">Extracting claims...</p>
        </div>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
